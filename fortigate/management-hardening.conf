# FortiGate management-plane hardening (FortiOS 7.x).
# Replace 10.10.0.0/24 with your admin network and "wan1" with your internet interfaces.
# Review each block against your version's CLI reference before applying.

# 1. No management on internet-facing interfaces
config system interface
    edit "wan1"
        set allowaccess ping
    next
end

# 2. Admins may only log in from the admin network
config system admin
    edit "admin"
        set trusthost1 10.10.0.0 255.255.255.0
    next
end

# 3. Session and brute-force limits, modern crypto only
config system global
    set admintimeout 10
    set admin-lockout-threshold 3
    set admin-lockout-duration 900
    set admin-https-redirect enable
    set strong-crypto enable
end

# 4. Password policy for local admins
config system password-policy
    set status enable
    set apply-to admin-password
    set minimum-length 14
    set min-upper-case-letter 1
    set min-lower-case-letter 1
    set min-number 1
    set min-non-alphanumeric 1
end
